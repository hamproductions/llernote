name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  workflow_run:
    workflows: ['Update Data']
    types: [completed]

env:
  DO_NOT_TRACK: '1'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Project
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install Dependencies
        uses: ./.github/composite-actions/setup
      - name: Build
        run: PUBLIC_ENV__BASE_URL=/${{ github.event.repository.name }} PUBLIC_ENV__EVENTERNOTE_API_URL=${{ secrets.PUBLIC_ENV__EVENTERNOTE_API_URL }} bun run ci:build
      - name: Build PR previews
        id: previews
        uses: ./.github/actions/pr-previews
        with:
          site-dir: dist/client
          build-output: dist/client
          install: bun install --frozen-lockfile && bun panda codegen
          build: bun run ci:build
          base-env: PUBLIC_ENV__BASE_URL
          base-path: /${{ github.event.repository.name }}/
          lock-file: bun.lockb
      - name: Preview links
        env:
          PREVIEWS: ${{ steps.previews.outputs.built }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          for number in $PREVIEWS; do
            echo "[PR #$number]($PAGE_URL/pr/$number/)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    needs: deploy
    env:
      PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit URLs using Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ needs.deploy.outputs.url }}
          budgetPath: ./budget.json
          runs: 5
          temporaryPublicStorage: false
      - name: Running Page Speed Insights
        uses: jakepartusch/psi-action@v1.3
        if: ${{ env.PSI_API_KEY != '' }}
        with:
          url: ${{ needs.deploy.outputs.url }}
          key: ${{ env.PSI_API_KEY }}
          threshold: 70
          strategy: desktop
